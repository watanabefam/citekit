name = "citekit-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"

# Deploy:   wrangler deploy
# Local:    wrangler dev            (real workerd runtime, no account needed)
# Secrets:  wrangler secret put S2_KEY      # free Semantic Scholar key -> raises the 429 limits
#           wrangler secret put CORE_KEY    # free CORE key
#           wrangler secret put PROXY_KEY   # optional X-Proxy-Key for scripted callers

[observability]
enabled = true

# Optional per-IP rate limit. Uncomment to cap abuse of an open-ish proxy.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 60, period = 60 }
